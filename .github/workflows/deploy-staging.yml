name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Approved 40-character commit SHA to deploy to Hostinger staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved commit to Hostinger staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate requested commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Configure SSH key
        env:
          HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${HOSTINGER_VPS_SSH_KEY}" > "${HOME}/.ssh/hostinger_staging"
          chmod 600 "${HOME}/.ssh/hostinger_staging"

      - name: Register Hostinger host key
        env:
          HOSTINGER_VPS_HOST: ${{ secrets.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_SSH_PORT: ${{ secrets.HOSTINGER_VPS_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          ssh-keyscan -p "${HOSTINGER_VPS_SSH_PORT}" "${HOSTINGER_VPS_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Run server-side staging deployment
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          HOSTINGER_VPS_HOST: ${{ secrets.HOSTINGER_VPS_HOST }}
          HOSTINGER_VPS_USER: ${{ secrets.HOSTINGER_VPS_USER }}
          HOSTINGER_VPS_SSH_PORT: ${{ secrets.HOSTINGER_VPS_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "${HOME}/.ssh/hostinger_staging" \
            -p "${HOSTINGER_VPS_SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${HOSTINGER_VPS_USER}@${HOSTINGER_VPS_HOST}" \
            "cd /opt/edumall-career/repo && ./scripts/deploy-staging.sh '${COMMIT_SHA}'"
