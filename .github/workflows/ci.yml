name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-0/**"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://edumall:ci-placeholder@localhost:5432/edumall_ci?schema=public

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency security audit
        run: pnpm security:audit

      - name: Docker Compose syntax validation
        run: docker compose -f infrastructure/docker/docker-compose.yml config
        env:
          POSTGRES_USER: edumall
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: edumall_ci
