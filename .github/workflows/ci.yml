name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-0/**"
      - "phase-2/**"
      - "phase-3/**"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edumall
          POSTGRES_PASSWORD: ci-integration
          POSTGRES_DB: edumall_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumall -d edumall_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://edumall:ci-placeholder@localhost:5432/edumall_ci?schema=public

      - name: PostgreSQL integration tests
        run: pnpm --filter @edumall/database test:integration
        env:
          NODE_ENV: test
          RUN_DATABASE_INTEGRATION_TESTS: "true"
          DATABASE_INTEGRATION_URL: postgresql://edumall:ci-integration@localhost:5432/edumall_integration?schema=public

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency security audit
        run: pnpm security:audit

      - name: Docker Compose syntax validation
        run: docker compose -f infrastructure/docker/docker-compose.yml config
        env:
          POSTGRES_USER: edumall
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: edumall_ci
